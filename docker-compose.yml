services:
  db:
    # La imagen oficial postgis/postgis es SOLO amd64. En un servidor ARM
    # (Oracle Cloud Always Free, Ampere, Graviton, Raspberry Pi) no arranca.
    # Para esos casos, poné en el .env:
    #   POSTGIS_IMAGE=imresamu/postgis:16-3.4
    # que es el build multiarquitectura del mismo PostGIS.
    image: ${POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: acopio
      POSTGRES_PASSWORD: acopio
      POSTGRES_DB: acopio
    ports:
      # Solo para poder conectarte con un cliente desde Windows. La app no lo
      # necesita: le llega a la base por la red interna de Docker.
      # 5433 en el host porque el 5432 ya lo tiene tomado otro Postgres.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Postgres corre solo lo que haya acá la PRIMERA vez que se crea el
      # volumen. Por eso el esquema se aplica sin que tengas que hacer nada.
      # Montamos el archivo suelto, no la carpeta: si montáramos db/ entero,
      # los datos de prueba también se cargarían automáticamente.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # La carpeta completa queda disponible para correr los otros .sql a mano.
      - ./db:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acopio -d acopio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://acopio:acopio@db:5432/acopio
      ADMIN_TOKEN: ${ADMIN_TOKEN:?definí ADMIN_TOKEN en el archivo .env}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      # Sin curl ni wget en la imagen alpine de node: usamos el fetch de Node.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
