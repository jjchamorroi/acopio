<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Ícono de la pestaña: pin de mapa con un corazón calado.

    Pensado para 16 px, que es donde de verdad se ve: silueta gruesa, un solo
    color plano y el corazón recortado en negativo. Nada de degradados ni
    contornos finos — a ese tamaño se convierten en un borrón gris.

    El corazón está calado (fill-rule evenodd sobre un único trazado) y no
    pintado encima: así el hueco toma el color de la pestaña y el ícono se ve
    bien tanto en tema claro como oscuro.
  -->
